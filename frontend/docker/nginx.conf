# Runs as uid 101 on port 8080 (nginx-unprivileged). Only static files: the
# API is routed to the backend by CloudFront/ALB, never through this nginx.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Hashed build output: safe to cache for a year (CloudFront + browser).
    location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA routing: unknown paths return index.html, which must never be cached
    # so a new release is picked up immediately.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
