# Pod Security Admission per namespace:
#   restricted  - app namespace: non-root, no privilege escalation, seccomp, dropped caps
#   privileged  - monitoring: node-exporter needs host network/PID
apiVersion: v1
kind: Namespace
metadata:
  name: realworld
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    pod-security.kubernetes.io/enforce: restricted
