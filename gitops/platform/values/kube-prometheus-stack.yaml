# Static values; environment-specific ones come from the Application.
crds:
  enabled: true

prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: 40GB
    # Pick up ServiceMonitors/PodMonitors/rules from every namespace.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 200m, memory: 1Gi }
      limits: { memory: 2Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 50Gi

alertmanager:
  alertmanagerSpec:
    replicas: 1
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 2Gi
  config:
    route:
      receiver: sns
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: "null"
          matchers: [alertname = "Watchdog"]
        - receiver: "null"
          matchers: [alertname = "InfoInhibitor"]
    # receivers are set per environment in the Application (SNS topic ARN).

grafana:
  # Not exposed publicly: kubectl port-forward. Admin password is generated by
  # the chart into a Secret.
  persistence:
    enabled: true
    storageClassName: gp3
    size: 5Gi
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
    datasources:
      enabled: true
  defaultDashboardsTimezone: utc

# EKS manages these; their metrics endpoints are not reachable.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: true
