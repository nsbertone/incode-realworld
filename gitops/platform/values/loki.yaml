# Single binary + S3: simplest Loki that keeps logs off local disks.
# Scale-out path: deploymentMode SimpleScalable (read/write/backend).
deploymentMode: SingleBinary

loki:
  auth_enabled: true         # tenant = environment (X-Scope-OrgID)
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: s3
    # bucketNames and region come from the Application (Terraform outputs).
  limits_config:
    retention_period: 720h   # 30 days
    allow_structured_metadata: true
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: s3

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: gp3
    size: 10Gi
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 1Gi }

# Not needed in single-binary mode.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false

gateway:
  enabled: true
