# Log collector: one pod per node, tails that node's pods and pushes to Loki.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: {{ .Values.charts.alloy }}
      helm:
        releaseName: alloy
        valueFiles:
          - $repo/gitops/platform/values/alloy.yaml
        valuesObject:
          alloy:
            extraEnv:
              - name: CLUSTER
                value: {{ .Values.cluster.name }}
              - name: LOKI_TENANT
                value: {{ .Values.environment }}
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.targetRevision }}
      ref: repo
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  {{- include "bootstrap.syncPolicy" . | nindent 2 }}
