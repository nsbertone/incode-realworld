# Adds/removes nodes when pods are Pending / nodes are underused.
# Autoscaler minor version must match the Kubernetes minor (1.35).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-autoscaler
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/autoscaler
    chart: cluster-autoscaler
    targetRevision: {{ .Values.charts.clusterAutoscaler }}
    helm:
      valuesObject:
        awsRegion: {{ .Values.aws.region }}
        autoDiscovery:
          clusterName: {{ .Values.cluster.name }}
        rbac:
          serviceAccount:
            name: cluster-autoscaler
            annotations:
              eks.amazonaws.com/role-arn: {{ .Values.irsa.clusterAutoscaler }}
        extraArgs:
          balance-similar-node-groups: true
          skip-nodes-with-local-storage: false
          expander: least-waste
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  {{- include "bootstrap.syncPolicy" . | nindent 2 }}
