apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: {{ .Values.charts.externalSecrets }}
    helm:
      valuesObject:
        installCRDs: true
        serviceAccount:
          name: external-secrets
          annotations:
            eks.amazonaws.com/role-arn: {{ .Values.irsa.externalSecrets }}
        serviceMonitor:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  {{- include "bootstrap.syncPolicy" . | nindent 2 }}
