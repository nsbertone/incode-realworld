# Database migrations run once per sync, before the new pods roll out.
# Sync hook in wave 0: after the ExternalSecrets (wave -1, ArgoCD waits until
# they are Healthy = Secret exists) and before the Deployment (wave 1).
# A PreSync hook would run before the secrets exist on the very first sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate
  labels: {{- include "rw.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-migrate
        {{- include "rw.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: backend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          command: {{- toYaml .Values.backend.migrateCommand | nindent 12 }}
          envFrom:
            - secretRef:
                name: backend-db
            - secretRef:
                name: backend-app
          env:
            {{- range $k, $v := .Values.backend.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- include "rw.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
