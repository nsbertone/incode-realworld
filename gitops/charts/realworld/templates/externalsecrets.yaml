# Secrets come from AWS Secrets Manager; nothing secret is stored in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-db
  labels: {{- include "rw.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .Values.secretRefreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: backend-db
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgresql://{{ "{{" }} .username {{ "}}" }}:{{ "{{" }} .password | urlquery {{ "}}" }}@{{ .Values.data.dbHost }}:{{ .Values.data.dbPort }}/{{ .Values.data.dbName }}?sslmode=require"
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.data.dbMasterSecretArn }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.data.dbMasterSecretArn }}
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-app
  labels: {{- include "rw.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .Values.secretRefreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: backend-app
  dataFrom:
    - extract:
        key: {{ .Values.data.appSecretName }}
