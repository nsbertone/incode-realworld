# ArgoCD for a single cluster. Not exposed to the internet: the UI/API is
# reached with kubectl port-forward (cluster API access = ArgoCD access).
global:
  domain: argocd.local

configs:
  params:
    # Git is polled every 60s; self-heal reverts manual drift.
    timeout.reconciliation: 60s
  cm:
    # Make sync waves in the root app-of-apps wait for each child Application
    # to be Healthy (ArgoCD dropped Application health by default in 1.8).
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs

server:
  service:
    type: ClusterIP
  metrics:
    enabled: true

controller:
  metrics:
    enabled: true

repoServer:
  # 2 replicas so one slow Helm render doesn't block every sync.
  replicas: 2
  metrics:
    enabled: true

dex:
  enabled: false

notifications:
  enabled: false
