# CI for the application: test -> scan -> build -> (main only) push + deploy.
#
# Deploy = commit the new image tag to gitops/envs/dev/values.yaml. ArgoCD in
# the cluster pulls that change; this workflow never talks to Kubernetes and
# holds no cluster credentials (pull-based CD).
#
# Repository variables (Settings -> Secrets and variables -> Actions -> Variables),
# set after `terraform apply` of infra/envs/dev/aws:
#   AWS_REGION            us-east-1 (the only region the org SCP allows)
#   AWS_BUILD_ROLE_ARN    output ci_role_arns.build
#   ECR_REGISTRY          <account>.dkr.ecr.<region>.amazonaws.com
#   ECR_PREFIX            realworld-dev   (repos are <prefix>/backend, <prefix>/frontend)
# Until they exist the pipeline still tests, scans and builds; push/deploy skip.
#
# Third-party actions are pinned to commit SHAs (a moved tag cannot change
# what runs here); Dependabot keeps the pins current.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Official RealWorld API spec, pinned to the commit the backend targets.
  REALWORLD_SPECS_REF: 25588846c314b15a5e427ffe816e6b4af7be68c7
  TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1

jobs:
  # ---------------------------------------------------------------- tests --
  backend-test:
    name: backend / lint + unit tests (PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: conduit
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --extra dev
      - name: Lint (ruff)
        run: uv run ruff check --no-fix && uv run ruff format --check
      - name: Unit tests
        run: uv run python manage.py test apps
        env:
          DEBUG: "true"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/conduit

  frontend-test:
    name: frontend / format + unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run format:check
      # Vitest runs on Node: its worker threads do not start under the Bun runtime.
      - name: Unit tests
        run: npx vitest run

  # ------------------------------------------------------------- security --
  secret-scan:
    name: security / secrets (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # whole history: a secret removed later is still leaked
          persist-credentials: false
      - run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" git /repo --config /repo/.gitleaks.toml --redact --no-banner

  iac-scan:
    name: security / IaC + Dockerfiles (trivy config)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Terraform, Dockerfiles, Helm charts and Kubernetes manifests. Accepted
      # findings live in .trivyignore.yaml, each with a written justification.
      - run: >
          docker run --rm -v "$PWD:/repo:ro" -w /repo "$TRIVY_IMAGE"
          config --severity HIGH,CRITICAL --ignorefile .trivyignore.yaml
          --exit-code 1 .

  # ---------------------------------------------------------------- build --
  build:
    name: build / ${{ matrix.component }}
    needs: [backend-test, frontend-test, secret-scan, iac-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC -> AWS role, no stored AWS keys
      actions: read   # download the perf baseline artifact from main
    strategy:
      fail-fast: true
      matrix:
        component: [backend, frontend]
    env:
      LOCAL_IMAGE: ci/${{ matrix.component }}:${{ github.sha }}
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_BUILD_ROLE_ARN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.component }}
          pull: true # always the latest base image patches
          load: true
          push: false
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # Fails on HIGH/CRITICAL vulnerabilities that have a fix available.
      - name: Scan image (trivy)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE"
          image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$LOCAL_IMAGE"

      # Official RealWorld API spec against the built image (not the source),
      # so what is tested is exactly what gets deployed.
      - name: Check out RealWorld API spec
        if: matrix.component == 'backend'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: realworld-apps/realworld
          ref: ${{ env.REALWORLD_SPECS_REF }}
          path: .realworld
          persist-credentials: false
      - name: API spec tests (hurl)
        if: matrix.component == 'backend'
        run: .github/scripts/api-tests.sh "$LOCAL_IMAGE" .realworld/specs/api
      # Bonus: performance regression detection. k6 load test against the
      # same image, p95 per endpoint compared with the last green run on main.
      - name: Load test (k6)
        if: matrix.component == 'backend'
        run: .github/scripts/perf-test.sh "$LOCAL_IMAGE" "$RUNNER_TEMP/perf-summary.json"
      - name: Download perf baseline (last successful main run)
        if: matrix.component == 'backend'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
                     --status success --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -n "$run_id" ] && gh run download "$run_id" -R "$GITHUB_REPOSITORY" \
               -n perf-summary -D "$RUNNER_TEMP/baseline"; then
            echo "baseline from run $run_id"
          else
            echo "no baseline yet (first run on main): regression check skipped"
          fi
      - name: Compare with baseline
        if: matrix.component == 'backend'
        run: |
          base="$RUNNER_TEMP/baseline/perf-summary.json"
          [ -f "$base" ] || exit 0
          python3 loadtest/compare.py "$base" "$RUNNER_TEMP/perf-summary.json" 1.5 \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep perf summary (next runs compare against it)
        if: matrix.component == 'backend'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-summary
          path: ${{ runner.temp }}/perf-summary.json
          retention-days: 30

      - name: Backend logs (on failure)
        if: failure() && matrix.component == 'backend'
        run: tail -n 200 "$RUNNER_TEMP/backend.log" || true

      # ---- main only: push to ECR ----
      - name: AWS credentials (OIDC)
        if: env.PUSH == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: ECR login
        if: env.PUSH == 'true'
        uses: aws-actions/amazon-ecr-login@aded0d722166a37980e030aa969dda0bfe6b6947 # v2.1.7
      - name: Push (tag = git SHA, immutable)
        if: env.PUSH == 'true'
        env:
          REPO: ${{ vars.ECR_PREFIX }}/${{ matrix.component }}
          REMOTE: ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_PREFIX }}/${{ matrix.component }}:${{ github.sha }}
        run: |
          # Tags are immutable in ECR: a re-run of the same commit must not fail.
          if aws ecr describe-images --repository-name "$REPO" \
               --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "$REMOTE already exists, skipping push"
            exit 0
          fi
          docker tag "$LOCAL_IMAGE" "$REMOTE"
          docker push "$REMOTE"
          echo "pushed $REMOTE" >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------- deploy --
  deploy-dev:
    name: deploy / dev (gitops tag bump)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_BUILD_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # commit the new tag
    # One deploy at a time; a newer pending run replaces an older pending one.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Bump image tags
        run: |
          yq -i '.backend.image.tag = strenv(GITHUB_SHA) | .frontend.image.tag = strenv(GITHUB_SHA)' \
            gitops/envs/dev/values.yaml
          git diff --stat
      # Commits made with GITHUB_TOKEN do not trigger new workflow runs, so
      # this cannot loop. ArgoCD sees the commit within its poll interval.
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(dev): ${GITHUB_SHA::7}"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep $((attempt * 5))
          done
          echo "dev -> ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
