# Weekly dependency updates as PRs; each PR runs the full CI (tests + scans).
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    groups:
      python-minor-patch: { update-types: [minor, patch] }

  - package-ecosystem: bun
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      frontend-minor-patch: { update-types: [minor, patch] }

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: { interval: weekly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }

  - package-ecosystem: terraform
    directories:
      - /infra/global
      - /infra/envs/dev/aws
      - /infra/envs/dev/argocd
      - /infra/modules/*
    schedule: { interval: weekly }
